<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f0e6cf;
    --parchment-dark: #e6d8b6;
    --parchment-deep: #d9c79e;
    --ink: #2a1d10;
    --ink-soft: #5a4632;
    --ink-faint: #8a7355;
    --land: #c97a4a;
    --land-shadow: #a8612f;
    --land-line: #6b3618;
    --water: #d8e4e0;
    --water-line: #97a89b;
    --correct: #6b8e3d;
    --correct-line: #3f5722;
    --wrong: #b03434;
    --wrong-deep: #7a1f1f;
    --reveal: #d49b2f;
    --gold: #b8862d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Spectral', Georgia, serif;
    color: var(--ink);
    background: var(--parchment);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 60% 40% at 25% 15%, rgba(184,134,45,0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 75% 85%, rgba(168,82,42,0.07), transparent 55%),
      var(--parchment);
    background-attachment: fixed;
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.11 0 0 0 0 0.06 0 0 0 0.55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
    opacity: 0.22;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1320px;
    margin: 0 auto;
    padding: 26px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
    flex-wrap: wrap;
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 100%;
    height: 1px;
    background: var(--ink);
    opacity: 0.4;
  }

  .brand { display: flex; flex-direction: column; line-height: 1; }
  .brand .label {
    font-family: 'Spectral', serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .brand .label::before { content: '— '; color: var(--ink-faint); }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(38px, 6.5vw, 66px);
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .stats { display: flex; gap: 24px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  .stat-label {
    font-family: 'Spectral', serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--ink);
    font-feature-settings: 'tnum';
    line-height: 1;
  }
  .stat-value.gold { color: var(--gold); }
  .stat-value.red { color: var(--wrong); }

  /* CONTROLS */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .pill-group {
    display: inline-flex;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    background: var(--parchment-dark);
  }

  .pill {
    padding: 9px 16px;
    font-family: 'Spectral', serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .pill + .pill { border-left: 1px solid rgba(42,29,16,0.18); }
  .pill.active {
    background: var(--ink);
    color: var(--parchment);
    letter-spacing: 0.22em;
  }
  .pill:hover:not(.active) { background: rgba(42,29,16,0.08); color: var(--ink); }

  .btn {
    padding: 9px 18px;
    font-family: 'Spectral', serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.18s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .btn:hover { background: var(--ink); color: var(--parchment); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--parchment); }
  .btn.primary:hover { background: var(--ink); border-color: var(--ink); }

  .btn.toggle .toggle-led {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: transparent;
    transition: all 0.18s ease;
  }
  .btn.toggle.on { background: var(--ink); color: var(--parchment); }
  .btn.toggle.on .toggle-led {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 6px var(--gold);
  }

  /* PROMPT */
  .prompt-bar {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 22px;
    background: var(--parchment-dark);
    border: 1px solid var(--ink);
    border-radius: 4px;
    flex-wrap: wrap;
    box-shadow: inset 0 0 0 1px rgba(240,230,207,0.5);
  }
  .prompt-label {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .prompt-target {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(22px, 3vw, 30px);
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .prompt-feedback {
    margin-left: auto;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    transition: color 0.2s, opacity 0.2s;
    min-height: 1em;
  }
  .prompt-feedback.correct { color: var(--correct); }
  .prompt-feedback.wrong { color: var(--wrong); }

  /* MAP */
  .map-wrap {
    flex: 1;
    min-height: 600px;
    background: var(--water);
    border: 1px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    background-image:
      repeating-linear-gradient(0deg, rgba(151,168,155,0.08) 0, rgba(151,168,155,0.08) 1px, transparent 1px, transparent 18px),
      repeating-linear-gradient(90deg, rgba(151,168,155,0.08) 0, rgba(151,168,155,0.08) 1px, transparent 1px, transparent 18px);
    box-shadow: inset 0 0 60px rgba(42,29,16,0.08);
  }

  .compass {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 56px;
    height: 56px;
    opacity: 0.55;
    pointer-events: none;
  }

  /* zoom controls overlay */
  .zoom-controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 4;
  }
  .zoom-btn {
    width: 34px;
    height: 34px;
    background: var(--parchment-dark);
    border: 1px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    padding: 0;
  }
  .zoom-btn:hover { background: var(--ink); color: var(--parchment); }
  .zoom-btn.reset {
    width: auto;
    padding: 0 12px;
    height: 34px;
    font-family: 'Spectral', serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-style: italic;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
  }
  .zoom-btn.reset.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #map {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #map.grabbing { cursor: grabbing; }

  .graticule {
    fill: none;
    stroke: rgba(42,29,16,0.07);
    stroke-width: 0.5;
    vector-effect: non-scaling-stroke;
  }

  .country {
    fill: var(--land);
    stroke: var(--land-line);
    stroke-width: 0.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill 0.2s ease;
    vector-effect: non-scaling-stroke;
  }
  .country:hover { fill: var(--land-shadow); }
  .country.correct {
    fill: var(--correct);
    stroke: var(--correct-line);
    cursor: default;
  }
  .country.correct:hover { fill: var(--correct); }
  .country.missed {
    fill: var(--wrong);
    stroke: var(--wrong-deep);
    cursor: default;
  }
  .country.missed:hover { fill: var(--wrong); }
  .country.wrong-flash {
    fill: var(--wrong) !important;
    animation: shake 0.4s ease;
  }
  .country.non-target {
    fill: #b5a283;
    stroke: rgba(107,54,24,0.6);
    cursor: default;
    pointer-events: none;
  }
  @keyframes shake {
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(-1px, 0); }
    50% { transform: translate(1px, 0); }
    75% { transform: translate(-1px, 0); }
  }

  .country-label {
    pointer-events: none;
    font-family: 'Spectral', serif;
    font-size: 9px;
    font-weight: 400;
    fill: var(--ink);
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(240,230,207,0.85);
    stroke-width: 2.4;
    stroke-linejoin: round;
    letter-spacing: 0.04em;
  }

  /* miss marker */
  .miss-marker .dot {
    fill: var(--wrong-deep);
    stroke: rgba(240,230,207,0.9);
    stroke-width: 1;
  }
  .miss-marker .pulse {
    fill: none;
    stroke: var(--wrong);
    stroke-width: 1.5;
    animation: pulse-out 1.4s ease-out;
  }
  @keyframes pulse-out {
    0%   { r: 5;  opacity: 0.85; }
    100% { r: 22; opacity: 0; }
  }
  .miss-marker .miss-label {
    pointer-events: none;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 10px;
    font-weight: 600;
    fill: var(--parchment);
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--wrong-deep);
    stroke-width: 2.6;
    stroke-linejoin: round;
    letter-spacing: 0.03em;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--parchment);
    padding: 5px 11px;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.03em;
    border-radius: 3px;
    transform: translate(-50%, -150%);
    opacity: 0;
    transition: opacity 0.15s;
    white-space: nowrap;
    z-index: 5;
    box-shadow: 0 4px 14px rgba(42,29,16,0.25);
  }
  .tooltip.visible { opacity: 1; }

  /* END SCREEN */
  .end-screen {
    position: absolute;
    inset: 0;
    background: rgba(240,230,207,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 10;
    backdrop-filter: blur(3px);
    padding: 24px;
    text-align: center;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .end-screen .kicker {
    font-family: 'Spectral', serif;
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .end-screen h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(44px, 7vw, 64px);
    color: var(--ink);
    line-height: 0.95;
  }
  .end-screen .score-big {
    font-family: 'Fraunces', serif;
    font-size: clamp(64px, 11vw, 108px);
    color: var(--gold);
    font-weight: 700;
    line-height: 1;
    font-feature-settings: 'tnum';
  }
  .end-screen .verdict {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
    max-width: 480px;
  }

  footer {
    text-align: center;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    padding-top: 6px;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
  }
  .loading::after { content: ' …'; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots {
    0% { content: ' '; } 25% { content: ' .'; }
    50% { content: ' ..'; } 75% { content: ' ...'; }
  }

  @media (max-width: 720px) {
    .app { padding: 18px 14px; gap: 10px; }
    header { gap: 14px; padding-bottom: 10px; }
    .stats { width: 100%; justify-content: space-between; gap: 10px; }
    .stat-value { font-size: 22px; }
    .controls { width: 100%; }
    .pill { padding: 8px 11px; font-size: 10px; letter-spacing: 0.14em; }
    .btn { padding: 8px 13px; font-size: 10px; letter-spacing: 0.14em; }
    .map-wrap { min-height: 460px; }
    .compass { width: 42px; height: 42px; }
    .country-label { font-size: 7.5px; }
    .miss-marker .miss-label { font-size: 8.5px; }
    .zoom-btn { width: 30px; height: 30px; font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="label">An Atlas of</span>
        <h1>Europe</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Found</span>
          <span class="stat-value gold" id="found">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Missed</span>
          <span class="stat-value red" id="missed">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Of</span>
          <span class="stat-value" id="total">—</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="pill-group" id="mode">
        <button class="pill active" data-mode="quiz">Quiz</button>
        <button class="pill" data-mode="learn">Study</button>
      </div>
      <button class="btn toggle" id="microstatesToggle" title="Include microstates: Andorra, Monaco, San Marino, Vatican, Liechtenstein, Malta">
        <span class="toggle-led"></span> Microstates
      </button>
      <button class="btn" id="skip">Skip ›</button>
      <button class="btn" id="restart">New Round</button>
    </div>

    <div class="prompt-bar" id="promptBar">
      <span class="prompt-label">Find</span>
      <span class="prompt-target" id="target">—</span>
      <span class="prompt-feedback" id="feedback"></span>
    </div>

    <div class="map-wrap">
      <div class="loading" id="loading">Unfolding the map</div>
      <svg id="map" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="zoom-controls">
        <button class="zoom-btn reset" id="resetView" title="Reset view">↺ Reset</button>
        <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      </div>
      <svg class="compass" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#2a1d10" stroke-width="1"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="#2a1d10" stroke-width="0.5"/>
        <path d="M50 8 L54 50 L50 92 L46 50 Z" fill="#2a1d10"/>
        <path d="M50 8 L54 50 L50 50 Z" fill="#b8862d"/>
        <path d="M8 50 L50 54 L92 50 L50 46 Z" fill="#2a1d10" opacity="0.55"/>
        <text x="50" y="6" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="8" fill="#2a1d10">N</text>
      </svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <footer>Two guesses per country. Scroll or use +/− to zoom; click & drag to pan.</footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
// All European countries (ISO numeric codes)
const EUROPE_CODES = new Set([
  '826','250','276','380','724','620','528','056','442','756','040','372','352',
  '578','752','246','208','616','203','703','348','642','100','300','008','807',
  '688','383','070','191','705','499','498','804','112','643','233','428','440',
  '196','470','020','674','438','492','336'
]);

// Microstates + Malta + Cyprus — small island/landlocked tinies. Toggleable.
const MICROSTATES = new Set([
  '020','674','438','492','336','470','196'  // Andorra, San Marino, Liechtenstein, Monaco, Vatican, Malta, Cyprus
]);

// Russia is huge and Asian-dominant — included as a quiz answer but excluded
// from the map's bounds fit so it doesn't dominate the frame.
const RUSSIA = '643';

const NAME_OVERRIDES = {
  '643': 'Russia',
  '826': 'United Kingdom',
  '807': 'North Macedonia',
  '203': 'Czechia',
  '498': 'Moldova',
  '070': 'Bosnia & Herzegovina',
  '336': 'Vatican City',
};

const code3 = (id) => String(id).padStart(3, '0');
const W = 1000, H = 760;

const state = {
  mode: 'quiz',
  includeMicrostates: false,
  queue: [],
  queueIndex: 0,
  totalCount: 0,
  currentCode: null,
  attempts: 0,
  correct: new Set(),
  missed: new Set(),
  streak: 0,
  totalCorrect: 0,
  totalMissed: 0,
  feedbackTimer: null,
  zoom: null,
};

let svg, gMap, gGraticule, gNonTarget, gCountries, gLabels, gMarkers;
let projection, path, allEuropeData, nonEuropeData;
const tooltip = document.getElementById('tooltip');

async function init() {
  try {
    const data = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
    const countries = topojson.feature(data, data.objects.countries);
    allEuropeData = countries.features.filter(f => EUROPE_CODES.has(code3(f.id)));
    // Render neighbors (N. Africa, Turkey, etc.) as faded context — not clickable
    const NEIGHBORS = new Set(['012','504','732','788','434','818','275','760','792','048','268','051','031','004','398','143']);
    nonEuropeData = countries.features.filter(f => NEIGHBORS.has(code3(f.id)));

    document.getElementById('loading').style.display = 'none';
    setupMap();
    bindControls();
    renderMap();
    startGame();
  } catch (e) {
    console.error(e);
    document.getElementById('loading').textContent = 'Could not load the map. Check your connection and refresh.';
  }
}

function setupMap() {
  svg = d3.select('#map');
  gMap = svg.append('g');
  gGraticule = gMap.append('path').attr('class', 'graticule');
  gNonTarget = gMap.append('g').attr('class', 'non-target');
  gCountries = gMap.append('g').attr('class', 'countries');
  gLabels = gMap.append('g').attr('class', 'labels');
  gMarkers = gMap.append('g').attr('class', 'markers');

  state.zoom = d3.zoom()
    .scaleExtent([1, 10])
    .translateExtent([[-50, -50], [W + 50, H + 50]])
    .on('zoom', (event) => {
      gMap.attr('transform', event.transform);
      const zoomed = event.transform.k > 1.02;
      document.getElementById('resetView').classList.toggle('visible', zoomed);
    })
    .on('start', () => svg.node().classList.add('grabbing'))
    .on('end', () => svg.node().classList.remove('grabbing'));

  svg.call(state.zoom);
  svg.on('dblclick.zoom', null);
}

function getQuizData() {
  return allEuropeData.filter(f => {
    const code = code3(f.id);
    if (!state.includeMicrostates && MICROSTATES.has(code)) return false;
    return true;
  });
}

function renderMap() {
  // Lambert Conformal Conic is the standard projection for Europe maps.
  projection = d3.geoConicConformal()
    .rotate([-10, 0])
    .parallels([35, 65]);

  // Fit to all of Europe EXCEPT Russia so the frame centers on Europe proper;
  // Russia's western edge will still spill into view on the right.
  const fitData = allEuropeData.filter(f => code3(f.id) !== RUSSIA);
  projection.fitExtent([[16, 16], [W - 16, H - 16]], { type: 'FeatureCollection', features: fitData });
  path = d3.geoPath(projection);

  gGraticule.attr('d', path(d3.geoGraticule().step([10, 10])()));

  // Faded neighbors for context (not clickable, not quizzable)
  gNonTarget.selectAll('path').remove();
  gNonTarget.selectAll('path')
    .data(nonEuropeData)
    .join('path')
    .attr('class', 'country non-target')
    .attr('d', path);

  gCountries.selectAll('path.country').remove();
  gCountries.selectAll('path.country')
    .data(allEuropeData)
    .join('path')
    .attr('class', 'country')
    .attr('d', path)
    .attr('data-code', d => code3(d.id))
    .style('display', d => {
      const code = code3(d.id);
      // Hide microstates when toggle is off so they don't render as unclickable specks
      if (!state.includeMicrostates && MICROSTATES.has(code)) return 'none';
      return null;
    })
    .on('mousemove', onCountryHover)
    .on('mouseleave', onCountryLeave)
    .on('click', onCountryClick);

  gLabels.selectAll('*').remove();
  gMarkers.selectAll('*').remove();

  svg.call(state.zoom.transform, d3.zoomIdentity);
}

function countryName(code) {
  if (NAME_OVERRIDES[code]) return NAME_OVERRIDES[code];
  const f = allEuropeData.find(d => code3(d.id) === code);
  return f?.properties?.name || 'Unknown';
}

function onCountryHover(event, d) {
  const code = code3(d.id);
  if (state.mode === 'learn' || state.correct.has(code) || state.missed.has(code)) {
    tooltip.textContent = countryName(code);
    const rect = document.querySelector('.map-wrap').getBoundingClientRect();
    tooltip.style.left = (event.clientX - rect.left) + 'px';
    tooltip.style.top = (event.clientY - rect.top - 8) + 'px';
    tooltip.classList.add('visible');
  }
}

function onCountryLeave() { tooltip.classList.remove('visible'); }

function onCountryClick(event, d) {
  if (state.mode === 'learn') return;
  if (!state.currentCode) return;
  const clicked = code3(d.id);
  if (state.correct.has(clicked) || state.missed.has(clicked)) return;
  if (clicked === state.currentCode) handleCorrect(clicked);
  else handleWrong(clicked);
}

function setFeedback(text, cls) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.className = 'prompt-feedback' + (cls ? ' ' + cls : '');
}

function clearFeedbackSoon(ms = 1400) {
  clearTimeout(state.feedbackTimer);
  state.feedbackTimer = setTimeout(() => setFeedback('', ''), ms);
}

function handleCorrect(code) {
  state.correct.add(code);
  state.totalCorrect++;
  state.streak++;
  state.attempts = 0;

  const node = gCountries.selectAll('path.country').filter(d => code3(d.id) === code);
  node.classed('correct', true);
  addCountryLabel(code);

  const nice = ['Nicely done', 'Right on', 'Spot on', 'Got it', 'Yes', 'Confirmed'];
  setFeedback('✓ ' + nice[Math.floor(Math.random() * nice.length)], 'correct');
  updateStats();

  setTimeout(() => { setFeedback('', ''); nextCountry(); }, 550);
}

function handleWrong(clickedCode) {
  state.attempts++;
  state.streak = 0;
  updateStats();

  const wrongNode = gCountries.selectAll('path.country').filter(d => code3(d.id) === clickedCode);
  wrongNode.classed('wrong-flash', true);
  setTimeout(() => wrongNode.classed('wrong-flash', false), 400);

  const wrongName = countryName(clickedCode);

  if (state.attempts >= 2) {
    state.missed.add(state.currentCode);
    state.totalMissed++;
    updateStats();

    const targetNode = gCountries.selectAll('path.country').filter(d => code3(d.id) === state.currentCode);
    targetNode.classed('missed', true);
    addMissMarker(state.currentCode);

    const targetName = countryName(state.currentCode);
    setFeedback(`✗ Out of guesses. That was ${targetName}.`, 'wrong');

    setTimeout(() => {
      setFeedback('', '');
      state.attempts = 0;
      nextCountry();
    }, 1700);
  } else {
    setFeedback(`✗ Not ${wrongName}. One more guess.`, 'wrong');
    clearFeedbackSoon(1500);
  }
}

function addMissMarker(code) {
  const feature = allEuropeData.find(f => code3(f.id) === code);
  if (!feature) return;
  const [cx, cy] = path.centroid(feature);
  if (!isFinite(cx) || !isFinite(cy)) return;

  const g = gMarkers.append('g')
    .attr('class', 'miss-marker')
    .attr('transform', `translate(${cx}, ${cy})`)
    .style('opacity', 0);

  g.append('circle').attr('class', 'pulse').attr('r', 5);
  g.append('circle').attr('class', 'dot').attr('r', 3.8);
  g.append('text').attr('class', 'miss-label').attr('y', -8).text(countryName(code));

  g.transition().duration(280).style('opacity', 1)
    .transition().delay(2200).duration(900).style('opacity', 0)
    .on('end', function() { d3.select(this).remove(); });
}

function addCountryLabel(code) {
  const feature = allEuropeData.find(f => code3(f.id) === code);
  if (!feature) return;
  const bounds = path.bounds(feature);
  const w = bounds[1][0] - bounds[0][0];
  const h = bounds[1][1] - bounds[0][1];
  const centroid = path.centroid(feature);
  const name = countryName(code);
  if (w < 18 || h < 11) return;
  const displayName = (w < 55 && name.length > 9) ? name.split(/[\s\-,&]/)[0] : name;

  gLabels.append('text')
    .attr('class', 'country-label')
    .attr('x', centroid[0])
    .attr('y', centroid[1])
    .attr('dy', '0.3em')
    .text(displayName)
    .attr('opacity', 0)
    .transition().duration(420).attr('opacity', 1)
    .transition().delay(2200).duration(900).attr('opacity', 0)
    .on('end', function() { d3.select(this).remove(); });
}

function buildQueue() {
  const codes = getQuizData().map(f => code3(f.id));
  for (let i = codes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [codes[i], codes[j]] = [codes[j], codes[i]];
  }
  return codes;
}

function startGame() {
  state.queue = buildQueue();
  state.totalCount = state.queue.length;
  state.queueIndex = 0;
  state.correct = new Set();
  state.missed = new Set();
  state.totalCorrect = 0;
  state.totalMissed = 0;
  state.streak = 0;
  state.attempts = 0;
  state.currentCode = null;

  gCountries.selectAll('path.country').classed('correct', false).classed('missed', false).classed('wrong-flash', false);
  gLabels.selectAll('*').remove();
  gMarkers.selectAll('*').remove();
  document.querySelector('.end-screen')?.remove();
  setFeedback('', '');
  document.getElementById('total').textContent = state.totalCount;

  if (state.mode === 'learn') {
    document.getElementById('promptBar').style.display = 'none';
  } else {
    document.getElementById('promptBar').style.display = 'flex';
    nextCountry();
  }
  updateStats();
}

function nextCountry() {
  if (state.queueIndex >= state.queue.length) { showEndScreen(); return; }
  state.currentCode = state.queue[state.queueIndex];
  state.queueIndex++;
  state.attempts = 0;
  document.getElementById('target').textContent = countryName(state.currentCode);
}

function updateStats() {
  document.getElementById('found').textContent = state.totalCorrect;
  document.getElementById('missed').textContent = state.totalMissed;
  document.getElementById('streak').textContent = state.streak;
}

function showEndScreen() {
  state.currentCode = null;
  document.getElementById('target').textContent = 'Complete';

  const wrap = document.querySelector('.map-wrap');
  const div = document.createElement('div');
  div.className = 'end-screen';
  const score = state.totalCorrect;
  const total = state.totalCount;
  const pct = total > 0 ? (score / total) * 100 : 0;

  let verdict;
  if (pct === 100) verdict = 'A perfect run. You know Europe cold.';
  else if (pct >= 90) verdict = "A cartographer's instinct — almost flawless.";
  else if (pct >= 75) verdict = 'Strong. A few Balkan borders worth revisiting.';
  else if (pct >= 50) verdict = 'Solid foundation. Drill the missed countries in Study mode.';
  else if (pct >= 25) verdict = 'Plenty of new ground to chart. Run it back.';
  else verdict = 'Try Study mode first to learn the layout, then quiz yourself.';

  div.innerHTML = `
    <span class="kicker">Expedition complete</span>
    <h2>Well traveled</h2>
    <div class="score-big">${score} / ${total}</div>
    <p class="verdict">${verdict}</p>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn primary" id="endRestart">Run it back</button>
      <button class="btn" id="endStudy">Study mode</button>
    </div>
  `;
  wrap.appendChild(div);

  div.querySelector('#endRestart').addEventListener('click', startGame);
  div.querySelector('#endStudy').addEventListener('click', () => {
    document.querySelectorAll('#mode .pill').forEach(p => p.classList.toggle('active', p.dataset.mode === 'learn'));
    state.mode = 'learn';
    startGame();
  });
}

function bindControls() {
  document.getElementById('mode').addEventListener('click', e => {
    const t = e.target.closest('.pill'); if (!t) return;
    document.querySelectorAll('#mode .pill').forEach(p => p.classList.remove('active'));
    t.classList.add('active');
    state.mode = t.dataset.mode;
    startGame();
  });

  document.getElementById('microstatesToggle').addEventListener('click', (e) => {
    state.includeMicrostates = !state.includeMicrostates;
    e.currentTarget.classList.toggle('on', state.includeMicrostates);
    renderMap();
    startGame();
  });

  document.getElementById('skip').addEventListener('click', () => {
    if (state.mode !== 'quiz' || !state.currentCode) return;
    state.queue.push(state.currentCode);
    state.streak = 0;
    state.attempts = 0;
    setFeedback("Skipped — we'll come back to it", '');
    clearFeedbackSoon(1100);
    updateStats();
    nextCountry();
  });

  document.getElementById('restart').addEventListener('click', startGame);

  document.getElementById('zoomIn').addEventListener('click', () => {
    svg.transition().duration(220).call(state.zoom.scaleBy, 1.6);
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    svg.transition().duration(220).call(state.zoom.scaleBy, 1 / 1.6);
  });
  document.getElementById('resetView').addEventListener('click', () => {
    svg.transition().duration(360).call(state.zoom.transform, d3.zoomIdentity);
  });
}

init();
</script>
</body>
</html>
